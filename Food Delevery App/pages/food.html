<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Details | Food Delivery App</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/food.css">
</head>

<body>
    <header class="main-header">

        <a href="home.html" class="brand">
            <div class="brand-icon">🍴</div>

            <div class="brand-text">
                <h2>Foodly</h2>
                <span>Fresh. Fast. Delicious.</span>
            </div>
        </a>

        <nav class="main-nav">

            <a href="home.html" class="nav-item">
                <span>🏠</span>
                <span>Home</span>
            </a>

            <a href="restaurants.html" class="nav-item">
                <span>🍽️</span>
                <span>Restaurants</span>
            </a>

            <a href="orders.html" class="nav-item">
                <span>📦</span>
                <span>My Orders</span>
            </a>

            <a href="offers.html" class="nav-item">
                <span>🎁</span>
                <span>Offers</span>
            </a>

        </nav>

        <div class="header-actions">

            <button class="header-icon" type="button" aria-label="Search">

            </button>

            <a href="cart.html" class="header-icon cart-icon" aria-label="Cart">

            </a>

        <div class="listing-container" id="food-detail">
            <p class="loading-state">Loading food details...</p>
        </div>
    </main>
    <footer class="listing-footer">
        <div class="listing-container">Food Delivery App <span>Fictional demo food for learning.</span></div>
    </footer>
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/food.js"></script>

</html>
