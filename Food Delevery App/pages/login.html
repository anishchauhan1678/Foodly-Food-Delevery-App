<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Food Delivery App</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/checkout.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>
    <header class="main-header">

        <a href="../index.html" class="brand">
            <div class="brand-icon">🍴</div>

            <div class="brand-text">
                <h2>Foodly</h2>
                <span>Fresh. Fast. Delicious.</span>
            </div>
        </a>

        <nav class="main-nav">

            <a href="../index.html" class="nav-item">
                <span>🏠</span>
                <span>Home</span>
            </a>

            <a href="restaurants.html" class="nav-item">
                <span>🍽️</span>
                <span>Restaurants</span>
            </a>

            <a href="orders.html" class="nav-item">
                <span>📦</span>
                <span>My Orders</span>
            </a>

            <a href="offers.html" class="nav-item">
                <span>🎁</span>
                <span>Offers</span>
            </a>

        </nav>

        <div class="header-actions">

            <button class="header-icon" type="button" aria-label="Search">
                🔍
            </button>

            <a href="cart.html" class="header-icon cart-icon" aria-label="Cart">
                🛒
                <span class="cart-count">2</span>
            </a>

            <a href="profile.html" class="profile-icon" aria-label="Profile">
                👤
            </a>

        </div>

    </header>

    <main class="auth-shell">
        <section class="auth-card">
            <p class="kicker">Welcome back</p>
            <h1>Login</h1>
            <form id="login-form" novalidate>
                <div class="form-grid">
                    <div class="field-group full-width">
                        <label for="login-email">Email</label>
                        <input id="login-email" type="email" autocomplete="email" required>
                    </div>
                    <div class="field-group full-width">
                        <label for="login-password">Password</label>
                        <input id="login-password" type="password" autocomplete="current-password" required>
                    </div>
                </div>
                <div class="form-error" id="login-error" aria-live="polite"></div>
                <button class="primary-button auth-submit" type="submit">Login</button>
            </form>
            <div class="auth-links">
                <a href="register.html">Create Account</a>
                <a href="#" data-forgot-password>Password recovery will be available after backend authentication is connected.</a>
            </div>
        </section>
    </main>

    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/login-page.js"></script>
</body>

</html>
