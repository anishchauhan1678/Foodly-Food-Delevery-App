<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Details</title>
    <script>
        const foodDetailsId = new URLSearchParams(window.location.search).get("id");
        window.location.replace(`food.html${foodDetailsId ? `?id=${encodeURIComponent(foodDetailsId)}` : ""}`);
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/responsive.css">

    <link rel="stylesheet" href="../css/components.css">

</head>

<body>

    <!-- Food Details Page -->
    <main id="food-details-page">

        <!-- Food information -->
        <section id="food-details" class="section">
        </section>


        <!-- Restaurant information -->
        <section id="food-restaurant" class="section">
        </section>


        <!-- Related foods -->
        <section id="related-foods" class="section">
        </section>


        <!-- Empty state -->
        <section id="food-empty" class="section hidden">
        </section>

    </main>


</body>

</html>
