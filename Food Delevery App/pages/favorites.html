<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View and manage your favorite restaurants and dishes on Foodly.">
    <title>Favorites | Foodly</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background: #fff; }
        .favorites-page { max-width: 1180px; margin: 0 auto; padding: 2rem 1rem 4rem; }
        .header-row { display: flex; justify-content: space-between; align-items: end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .favorites-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; }
        .favorites-panel { background: #fff; border: 1px solid #ececec; border-radius: 24px; padding: 1.25rem; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.04); }
        .favorites-panel h2 { margin: 0 0 1rem; font-size: clamp(1.3rem, 2vw, 1.8rem); }
        .favorites-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
        .favorite-card { position: relative; overflow: hidden; border: 1px solid #ececec; border-radius: 18px; background: #fff; display: flex; flex-direction: column; }
        .favorite-card a { color: inherit; text-decoration: none; }
        .favorite-card .image-wrap { position: relative; height: 150px; overflow: hidden; }
        .favorite-card .image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .favorite-card .content { padding: 0.9rem; display: flex; flex-direction: column; gap: 0.6rem; }
        .favorite-card .meta-row { display: flex; justify-content: space-between; gap: 0.75rem; align-items: center; }
        .favorite-card .price { font-weight: 800; color: var(--dark); }
        .favorite-card .muted { color: #666; }
        .favorite-card .tag { display: inline-flex; align-items: center; justify-content: center; padding: 0.22rem 0.55rem; border-radius: 999px; background: #fff5eb; color: #ff7b2c; font-size: 0.7rem; font-weight: 700; }
        .favorite-empty { border: 1px dashed #d7d7d7; border-radius: 18px; padding: 2rem 1rem; text-align: center; color: #555; background: #fafafa; }
        .favorite-empty h3 { margin: 0 0 0.5rem; }
        @media (max-width: 820px) { .favorites-grid { grid-template-columns: 1fr; } }
    </style>
</head>

<body>
    <header class="main-header">
        <a href="home.html" class="brand">
            <div class="brand-icon">🍴</div>
            <div class="brand-text">
                <h2>Foodly</h2>
                <span>Fresh. Fast. Delicious.</span>
            </div>
        </a>

        <nav class="main-nav">
            <a href="home.html" class="nav-item"><span>🏠</span><span>Home</span></a>
            <a href="restaurants.html" class="nav-item"><span>🍽️</span><span>Restaurants</span></a>
            <a href="orders.html" class="nav-item"><span>📦</span><span>My Orders</span></a>
            <a href="offers.html" class="nav-item"><span>🎁</span><span>Offers</span></a>
            <a href="favorites.html" class="nav-item active"><span>❤️</span><span>Favorites</span></a>
        </nav>

        <div class="header-actions">
            <button class="header-icon" type="button" aria-label="Search">🔍</button>
            <a href="cart.html" class="header-icon cart-icon" aria-label="Cart">
                🛒
                <span class="cart-count">0</span>
            </a>
            <a href="favorites.html" class="header-icon favorite-header" aria-label="Favorites">
                ❤️
                <span class="favorite-count" hidden>0</span>
            </a>
            <a href="profile.html" class="profile-icon" aria-label="Profile">👤</a>
        </div>
    </header>

    <main class="favorites-page">
        <div class="header-row">
            <div>
                <p class="eyebrow">Saved items</p>
                <h1>Favorites</h1>
            </div>
            <div class="profile-actions">
                <a class="secondary-button" href="restaurants.html">Explore Restaurants</a>
            </div>
        </div>

        <div class="favorites-grid">
            <section class="favorites-panel" aria-labelledby="favorite-restaurants-heading">
                <h2 id="favorite-restaurants-heading">Restaurants</h2>
                <div id="favorite-restaurants-list" class="favorites-list" aria-live="polite"></div>
            </section>

            <section class="favorites-panel" aria-labelledby="favorite-foods-heading">
                <h2 id="favorite-foods-heading">Foods</h2>
                <div id="favorite-foods-list" class="favorites-list" aria-live="polite"></div>
            </section>
        </div>
    </main>

    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/site-auth.js"></script>
    <script type="module" src="../js/favorites-page.js"></script>
</body>

</html>
